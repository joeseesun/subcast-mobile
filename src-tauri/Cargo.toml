[package]
name = "subcast-mobile"
version = "0.1.2"
license = "AGPL-3.0-only"
description = "SubCast · 声渡 — overseas podcasts and YouTube with bilingual subtitles and AI Q&A"
authors = ["Qiaomu"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "subcast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-mobile = { path = "../plugins/mobile" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
minisign-verify = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "gzip", "brotli", "system-proxy", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
roxmltree = "0.20"
regex = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav", "flac", "ogg", "vorbis", "pcm"] }
anyhow = "1"
once_cell = "1"
urlencoding = "2"
dirs = "5"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
# Edge Read Aloud speaks over its own TLS WebSocket (edge_tts.rs), as on the desktop.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-pki-types = "1"
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# The App Store / TestFlight edition: YouTube only through YouTube's own player, never downloaded (App Review 5.2.3).
store = []

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
