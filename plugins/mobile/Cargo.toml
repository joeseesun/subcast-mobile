[package]
name = "tauri-plugin-mobile"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "SubCast's phone glue: background audio, lock-screen / notification controls, the system share sheet"
links = "tauri-plugin-mobile"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
